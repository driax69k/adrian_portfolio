<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Adrian Cordero profile placeholder</title>
  <desc id="desc">Abstract dark portrait placeholder with Adrian Cordero's initials</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="720" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20133a"/>
      <stop offset=".58" stop-color="#120b24"/>
      <stop offset="1" stop-color="#120b24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(570 310) rotate(130) scale(420 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="person" x1="280" y1="230" x2="540" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62566f"/>
      <stop offset="1" stop-color="#20133a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#c4b5d4" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <circle cx="400" cy="360" r="132" fill="url(#person)"/>
  <path d="M155 898c19-214 113-342 245-342s226 128 245 342H155Z" fill="url(#person)"/>
  <circle cx="400" cy="360" r="166" fill="none" stroke="#7c3aed" stroke-opacity=".16"/>
  <path d="M116 205h118M116 205v118M684 795H566M684 795V677" fill="none" stroke="#7c3aed" stroke-opacity=".55" stroke-width="2"/>
  <g transform="translate(66 790)">
    <rect width="158" height="76" rx="20" fill="#120b24" fill-opacity=".88" stroke="#7c3aed" stroke-opacity=".35"/>
    <text x="79" y="49" fill="#ede9fe" font-family="monospace" font-size="28" font-weight="700" text-anchor="middle">AC</text>
  </g>
</svg>
